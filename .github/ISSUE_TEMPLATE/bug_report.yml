name: Bug report
description: Something behaves incorrectly (NOT a detection bypass — see SECURITY.md for those)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Detection bypasses must be reported privately via the repository's Security tab, not here."
  - type: textarea
    id: what
    attributes: {label: What happened, description: Expected vs actual behaviour}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Reproduction, description: Command or code, render: shell}
    validations: {required: true}
  - type: input
    id: env
    attributes: {label: Environment, placeholder: "Python 3.12, Linux / Docker"}
